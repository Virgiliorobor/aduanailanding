version: '3.8'

services:
  aduanai-landing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aduanai-landing
    ports:
      - "8743:8743"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8743/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
